[project]
name = "prevloss"
version = "0.1.0"
description = "Protótipo local de monitoramento simulado de um conjunto motor-bomba"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.135.1",
    "numpy==2.4.2",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = ["httpx2==2.16.0", "pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
